<svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="12">
    <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#3A3F4B"/>
        </marker>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#FAF5E9"/>
            <stop offset="100%" stop-color="#F4EEE0"/>
        </linearGradient>
    </defs>

    <!-- Page background -->
    <rect x="0" y="0" width="980" height="480" fill="url(#bg)"/>

    <!-- Title -->
    <text x="490" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#0C234B">
        ONE-HealthRecord — System Architecture
    </text>
    <text x="490" y="50" text-anchor="middle" font-size="11" font-style="italic" fill="#6E6960">
        Dictation → structured FHIR → cross-species linkage → public-health surveillance
    </text>

    <!-- Lane labels -->
    <text x="20"  y="80" font-style="italic" fill="#6E6960">INPUT</text>
    <text x="270" y="80" font-style="italic" fill="#6E6960">MACHINE AUTHORSHIP</text>
    <text x="540" y="80" font-style="italic" fill="#6E6960">KNOWLEDGE</text>
    <text x="780" y="80" font-style="italic" fill="#6E6960">PUBLIC HEALTH</text>

    <!-- Input column -->
    <rect x="20"  y="100" width="200" height="64"  rx="14" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="120" y="127" text-anchor="middle" font-weight="600" fill="#0C234B">Clinician dictation</text>
    <text x="120" y="147" text-anchor="middle" font-size="11" fill="#6E6960">audio · text · structured</text>

    <rect x="20"  y="190" width="200" height="64" rx="14" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="120" y="217" text-anchor="middle" font-weight="600" fill="#0C234B">Veterinary record</text>
    <text x="120" y="237" text-anchor="middle" font-size="11" fill="#6E6960">VetCompass · in-clinic</text>

    <rect x="20"  y="280" width="200" height="64" rx="14" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="120" y="307" text-anchor="middle" font-weight="600" fill="#0C234B">Environmental data</text>
    <text x="120" y="327" text-anchor="middle" font-size="11" fill="#6E6960">EPA EQI · ADHS · vectors</text>

    <!-- Authorship column (Machine Authorship Engine) -->
    <rect x="260" y="100" width="220" height="244" rx="18" fill="#F4EEE0" stroke="#AB0520" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="370" y="123" text-anchor="middle" font-weight="600" fill="#AB0520">Machine Authorship Engine</text>

    <rect x="278" y="140" width="184" height="44" rx="10" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="370" y="167" text-anchor="middle">Phase segmentation</text>

    <rect x="278" y="193" width="184" height="44" rx="10" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="370" y="215" text-anchor="middle">Entity extraction</text>
    <text x="370" y="229" text-anchor="middle" font-size="10" fill="#6E6960">+ negation / hedge</text>

    <rect x="278" y="246" width="184" height="44" rx="10" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="370" y="268" text-anchor="middle">FHIR R4 builder</text>
    <text x="370" y="282" text-anchor="middle" font-size="10" fill="#6E6960">+ provenance · confidence</text>

    <text x="370" y="325" text-anchor="middle" font-size="10" font-style="italic" fill="#6E6960">production: BioClinicalBERT</text>

    <!-- Knowledge column -->
    <rect x="520" y="100" width="220" height="120" rx="14" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="630" y="127" text-anchor="middle" font-weight="600" fill="#0C234B">FHIR data store</text>
    <text x="630" y="147" text-anchor="middle" font-size="11" fill="#6E6960">Patient · Animal · Condition</text>
    <text x="630" y="163" text-anchor="middle" font-size="11" fill="#6E6960">Observation · Provenance</text>
    <text x="630" y="195" text-anchor="middle" font-size="10" font-style="italic" fill="#6E6960">SMART-on-FHIR API</text>

    <rect x="520" y="235" width="220" height="109" rx="14" fill="#FAF5E9" stroke="#3F6B47" stroke-width="1.4"/>
    <text x="630" y="261" text-anchor="middle" font-weight="600" fill="#3F6B47">One Health knowledge graph</text>
    <text x="630" y="281" text-anchor="middle" font-size="11" fill="#6E6960">Person ↔ Animal ↔ Disease</text>
    <text x="630" y="297" text-anchor="middle" font-size="11" fill="#6E6960">cross-species via SNOMED root</text>
    <text x="630" y="325" text-anchor="middle" font-size="10" font-style="italic" fill="#6E6960">production: Neo4j + GNN</text>

    <!-- Public health column -->
    <rect x="780" y="100" width="180" height="74" rx="14" fill="#FAF5E9" stroke="#AB0520"/>
    <text x="870" y="127" text-anchor="middle" font-weight="600" fill="#AB0520">Sentinel detectors</text>
    <text x="870" y="145" text-anchor="middle" font-size="10" fill="#6E6960">cross-species · vector</text>
    <text x="870" y="159" text-anchor="middle" font-size="10" fill="#6E6960">env-amplified · spike</text>

    <rect x="780" y="195" width="180" height="64" rx="14" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="870" y="221" text-anchor="middle" font-weight="600" fill="#0C234B">Differential privacy</text>
    <text x="870" y="241" text-anchor="middle" font-size="10" fill="#6E6960">Laplace mechanism · ε=1.0</text>

    <rect x="780" y="280" width="180" height="64" rx="14" fill="#FAF5E9" stroke="#D4CCB8"/>
    <text x="870" y="306" text-anchor="middle" font-weight="600" fill="#0C234B">Clinician + ADHS dashboards</text>
    <text x="870" y="325" text-anchor="middle" font-size="10" fill="#6E6960">map · graph · alerts</text>

    <!-- Arrows -->
    <line x1="222" y1="132" x2="278" y2="162" stroke="#3A3F4B" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="222" y1="222" x2="278" y2="215" stroke="#3A3F4B" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="222" y1="312" x2="538" y2="282" stroke="#3A3F4B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>

    <line x1="464" y1="225" x2="520" y2="160" stroke="#3A3F4B" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="630" y1="221" x2="630" y2="235" stroke="#3A3F4B" stroke-width="1.5" marker-end="url(#ar)"/>

    <line x1="742" y1="160" x2="780" y2="135" stroke="#3A3F4B" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="742" y1="290" x2="780" y2="225" stroke="#3A3F4B" stroke-width="1.5" marker-end="url(#ar)"/>

    <line x1="870" y1="174" x2="870" y2="193" stroke="#3A3F4B" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="870" y1="260" x2="870" y2="279" stroke="#3A3F4B" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- Caption -->
    <text x="490" y="430" text-anchor="middle" font-size="11" font-style="italic" fill="#6E6960">
        Every machine-authored resource carries source-text span, source-phase, confidence score, and engine version
    </text>
    <text x="490" y="450" text-anchor="middle" font-size="10" fill="#A39C8E">
        Capstone MVP — synthetic data only · University of Arizona · 2026
    </text>
</svg>
